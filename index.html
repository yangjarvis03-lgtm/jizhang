<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="theme-color" content="#5b6cff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>记账</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --ink:#1f2430; --muted:#8a90a2;
    --line:#eceef4; --primary:#5b6cff; --primary2:#7b6cff; --danger:#ef5350;
    --nav-h:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; touch-action:manipulation;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  .header{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff; padding:calc(env(safe-area-inset-top) + 16px) 20px 18px;
    border-radius:0 0 22px 22px;
  }
  .header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.5px;}
  .header .sub{margin-top:4px;font-size:12.5px;opacity:.85;}
  .wrap{max-width:480px;margin:0 auto;}
  section.tab{display:none;padding:16px;}
  section.tab.active{display:block;}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(30,40,90,.05);}
  .card + .card{margin-top:14px;}

  /* ---- 记账 tab ---- */
  .amount-box{text-align:center;padding:6px 0 14px;}
  .amount-box .label{font-size:12px;color:var(--muted);}
  .amount-box .val{font-size:42px;font-weight:700;margin-top:2px;line-height:1.1;}
  .amount-box .val small{font-size:24px;font-weight:600;margin-right:4px;color:var(--muted);}
  .amount-box .val.empty{color:#c4c8d4;}
  .amount-box .preview{height:20px;font-size:15px;font-weight:600;color:var(--primary);margin-top:3px;}
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .cat{border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;background:#fff;cursor:pointer;transition:.12s;}
  .cat .emo{font-size:23px;}
  .cat .nm{font-size:12px;margin-top:3px;color:var(--muted);}
  .cat.sel{border-color:var(--primary);background:#f0f2ff;}
  .cat.sel .nm{color:var(--primary);font-weight:600;}
  .field{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .field label{font-size:13px;color:var(--muted);width:42px;flex:none;}
  .field input{flex:1;border:none;background:#f5f6fa;border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);font-family:inherit;}
  .field input:focus{outline:2px solid #e0e3ff;}
  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
  .key{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 0;font-size:21px;font-weight:600;text-align:center;cursor:pointer;user-select:none;}
  .key:active{background:#eef0f7;}
  .key.op{color:var(--primary);font-weight:700;}
  .key.eq{background:var(--primary);color:#fff;border-color:var(--primary);}
  .key.eq:active{opacity:.85;}
  .btn{display:block;width:100%;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:600;color:#fff;background:var(--primary);margin-top:14px;cursor:pointer;font-family:inherit;}
  .btn:active{opacity:.9;}
  .btn.danger{background:#fff;color:var(--danger);border:1.5px solid #f6caca;margin-top:10px;}

  /* ---- 明细 tab ---- */
  .summary{display:flex;gap:12px;}
  .summary .box{flex:1;text-align:center;}
  .summary .box .t{font-size:12px;color:var(--muted);}
  .summary .box .n{font-size:22px;font-weight:700;margin-top:3px;}
  .day-group{margin-top:14px;}
  .day-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:0 4px 6px;}
  .rec{display:flex;align-items:center;gap:12px;background:#fff;border-radius:13px;padding:12px 14px;margin-top:8px;cursor:pointer;}
  .rec:active{background:#f7f8fc;}
  .rec .emo{font-size:22px;width:30px;text-align:center;flex:none;}
  .rec .mid{flex:1;min-width:0;}
  .rec .mid .c{font-size:15px;font-weight:500;}
  .rec .mid .n{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rec .amt{font-size:16px;font-weight:600;flex:none;}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px;}
  .empty .big{font-size:40px;display:block;margin-bottom:10px;}
  .backup{display:flex;gap:10px;margin-top:16px;}
  .backup button{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit;}

  /* ---- 统计 tab ---- */
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav button{background:#fff;border:1px solid var(--line);border-radius:10px;width:40px;height:36px;font-size:18px;cursor:pointer;color:var(--ink);}
  .month-nav .m{font-size:16px;font-weight:600;}
  .stat-total{text-align:center;margin:4px 0 8px;}
  .stat-total .t{font-size:12px;color:var(--muted);}
  .stat-total .n{font-size:34px;font-weight:700;}
  .stat-total .c{font-size:12px;color:var(--muted);margin-top:2px;}
  .donut-wrap{display:flex;justify-content:center;margin:8px 0 4px;}
  .legend{margin-top:6px;}
  .legend .row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);}
  .legend .row:first-child{border-top:none;}
  .legend .dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .legend .lab{flex:1;font-size:14px;}
  .legend .pct{font-size:12.5px;color:var(--muted);width:46px;text-align:right;}
  .legend .amt{font-size:14px;font-weight:600;width:88px;text-align:right;}
  .bars{display:flex;align-items:flex-end;gap:2px;height:130px;margin-top:6px;}
  .bars .bar{flex:1;background:linear-gradient(180deg,var(--primary),#aeb6ff);border-radius:3px 3px 0 0;min-height:2px;}
  .bars-x{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px;}
  .sec-title{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;}

  /* ---- bottom nav ---- */
  .nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);display:flex;z-index:10;}
  .nav button{flex:1;border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .nav button .ico{font-size:21px;}
  .nav button.on{color:var(--primary);}

  .toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(30,34,48,.92);color:#fff;
    padding:11px 20px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:.2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="hd-title">记账 💰</h1>
    <div class="sub" id="hd-sub">每天随手记，月底看统计</div>
  </div>

  <!-- ===== 记账 ===== -->
  <section class="tab active" id="tab-add">
    <div class="card">
      <div class="amount-box">
        <div class="label" id="add-mode-label">支出金额</div>
        <div class="val empty" id="amount-disp"><small>¥</small>0.00</div>
        <div class="preview" id="amount-preview"></div>
      </div>
      <div class="cats" id="cat-grid"></div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="in-date">
      </div>
      <div class="field">
        <label>备注</label>
        <input type="text" id="in-note" placeholder="可不填，比如：午饭、打车…" maxlength="40">
      </div>
      <div class="keypad" id="keypad"></div>
      <button class="btn" id="save-btn">保存</button>
      <button class="btn danger" id="del-btn" style="display:none">删除这笔</button>
    </div>
  </section>

  <!-- ===== 明细 ===== -->
  <section class="tab" id="tab-list">
    <div class="card">
      <div class="summary">
        <div class="box"><div class="t">今天</div><div class="n" id="sum-today">¥0.00</div></div>
        <div class="box"><div class="t">本月</div><div class="n" id="sum-month">¥0.00</div></div>
      </div>
    </div>
    <div id="list-area"></div>
    <div class="backup">
      <button id="export-btn">⬆️ 导出备份</button>
      <button id="import-btn">⬇️ 导入备份</button>
      <input type="file" id="import-file" accept="application/json,.json" style="display:none">
    </div>
  </section>

  <!-- ===== 统计 ===== -->
  <section class="tab" id="tab-stats">
    <div class="month-nav">
      <button id="m-prev">‹</button>
      <span class="m" id="m-label">2026年6月</span>
      <button id="m-next">›</button>
    </div>
    <div class="card">
      <div class="stat-total">
        <div class="t">本月总支出</div>
        <div class="n" id="st-total">¥0.00</div>
        <div class="c" id="st-count">共 0 笔</div>
      </div>
      <div id="st-body"></div>
    </div>
    <div class="card" id="bar-card">
      <p class="sec-title">每日支出</p>
      <div class="bars" id="st-bars"></div>
      <div class="bars-x" id="st-bars-x"></div>
    </div>
  </section>
</div>

<!-- bottom nav -->
<div class="nav">
  <button data-tab="add" class="on" id="nav-add"><span class="ico">➕</span>记账</button>
  <button data-tab="list" id="nav-list"><span class="ico">📋</span>明细</button>
  <button data-tab="stats" id="nav-stats"><span class="ico">📊</span>统计</button>
</div>
<div class="toast" id="toast"></div>

<script>
//==================== 数据 ====================
const STORE_KEY = 'jizhang_records_v1';
const CATS = [
  {key:'food',  nm:'餐饮', emo:'🍜', color:'#FF7043'},
  {key:'trans', nm:'交通', emo:'🚇', color:'#42A5F5'},
  {key:'shop',  nm:'购物', emo:'🛍️', color:'#EC407A'},
  {key:'fun',   nm:'娱乐', emo:'🎮', color:'#AB47BC'},
  {key:'home',  nm:'居住', emo:'🏠', color:'#26A69A'},
  {key:'med',   nm:'医疗', emo:'💊', color:'#EF5350'},
  {key:'study', nm:'学习', emo:'📚', color:'#66BB6A'},
  {key:'other', nm:'其他', emo:'📦', color:'#8D6E63'},
];
const catOf = k => CATS.find(c=>c.key===k) || CATS[CATS.length-1];

let records = load();
let amount = '';          // 正在输入的金额字符串
let selectedCat = null;   // 选中的分类 key
let editingId = null;     // null=新增，否则=正在编辑的记录 id
let statMonth = curMonth();// 统计页当前月份 'YYYY-MM'

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; } }
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(records)); updateHeaderSub(); }
function updateHeaderSub(){
  const t=todayStr(), m=curMonth();
  const dt=records.filter(r=>r.date===t).reduce((s,r)=>s+r.amount,0);
  const dm=records.filter(r=>r.date.startsWith(m)).reduce((s,r)=>s+r.amount,0);
  document.getElementById('hd-sub').textContent='今天已花 '+money(dt)+' · 本月 '+money(dm);
}

//==================== 工具 ====================
function money(n){ return '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function curMonth(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const WK = ['周日','周一','周二','周三','周四','周五','周六'];
function dateLabel(s){ const d=parseDate(s); return (d.getMonth()+1)+'月'+d.getDate()+'日 '+WK[d.getDay()]; }
function uid(){ return Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1400); }

//==================== 记账页 ====================
function renderCats(){
  const g=document.getElementById('cat-grid');
  g.innerHTML = CATS.map(c=>
    `<div class="cat${c.key===selectedCat?' sel':''}" data-cat="${c.key}">
       <div class="emo">${c.emo}</div><div class="nm">${c.nm}</div></div>`).join('');
  g.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{ selectedCat=el.dataset.cat; renderCats(); });
}
// 计算器：amount 可以是表达式，如 "12.5+30-2"
function lastOperand(){ const parts=amount.split(/[+\-]/); return parts[parts.length-1]; }
function evalExpr(s){
  if(!s) return null;
  s=s.replace(/[+\-.]+$/,'');                 // 去掉末尾未完成的运算符/小数点
  if(!s) return null;
  const tokens=s.match(/\d+\.?\d*|[+\-]/g);
  if(!tokens) return null;
  let v=parseFloat(tokens[0]);
  for(let i=1;i<tokens.length-0;i+=2){
    const n=parseFloat(tokens[i+1]);
    if(isNaN(n)) break;
    v = tokens[i]==='+' ? v+n : v-n;
  }
  return Math.round(v*100)/100;
}
function renderAmount(){
  const el=document.getElementById('amount-disp');
  const pv=document.getElementById('amount-preview');
  if(amount===''){
    el.className='val empty'; el.innerHTML='<small>¥</small>0.00';
    el.style.fontSize=''; pv.textContent='';
  } else {
    el.className='val'; el.innerHTML='<small>¥</small>'+amount;
    el.style.fontSize = amount.length>11 ? '28px' : '';
    const v=evalExpr(amount);
    pv.textContent = /[+\-]/.test(amount) && v!==null ? '= '+money(v) : '';
  }
}
function buildKeypad(){
  const keys=['7','8','9','⌫','4','5','6','+','1','2','3','-','C','.','0','='];
  document.getElementById('keypad').innerHTML = keys.map(k=>{
    const cls = k==='=' ? 'key eq' : (k==='+'||k==='-'||k==='C') ? 'key op' : 'key';
    return `<div class="${cls}" data-k="${k}">${k==='-'?'−':k}</div>`;
  }).join('');
  document.querySelectorAll('.key').forEach(el=>el.onclick=()=>tapKey(el.dataset.k));
}
function tapKey(k){
  if(k==='C'){ amount=''; renderAmount(); return; }
  if(k==='⌫'){ amount=amount.slice(0,-1); renderAmount(); return; }
  if(k==='='){ const v=evalExpr(amount); if(v!==null && v>0) amount=String(v); renderAmount(); return; }
  if(k==='+'||k==='-'){
    if(amount==='') return;                            // 不能以运算符开头
    const last=amount.slice(-1);
    if(last==='+'||last==='-') amount=amount.slice(0,-1)+k;  // 连按运算符则替换
    else if(last==='.') return;
    else amount+=k;
    renderAmount(); return;
  }
  if(k==='.'){
    const lo=lastOperand();
    if(lo==='') amount+='0.';
    else if(!lo.includes('.')) amount+='.';
    renderAmount(); return;
  }
  // 数字（限制作用于当前操作数）
  const lo=lastOperand();
  if(lo==='0') amount=amount.slice(0,-1)+k;            // 去掉前导 0
  else {
    if(lo.includes('.') && lo.split('.')[1].length>=2) return;  // 最多两位小数
    if(!lo.includes('.') && lo.length>=8) return;               // 整数别太长
    amount+=k;
  }
  renderAmount();
}
function resetForm(){
  editingId=null; amount=''; selectedCat=null;
  document.getElementById('in-date').value=todayStr();
  document.getElementById('in-note').value='';
  document.getElementById('save-btn').textContent='保存';
  document.getElementById('add-mode-label').textContent='支出金额';
  document.getElementById('del-btn').style.display='none';
  renderAmount(); renderCats();
}
function loadForEdit(id){
  const r=records.find(x=>x.id===id); if(!r) return;
  switchTab('add');   // 先切页（会重置表单），再填充编辑内容
  editingId=id; amount=String(r.amount); selectedCat=r.category;
  document.getElementById('in-date').value=r.date;
  document.getElementById('in-note').value=r.note||'';
  document.getElementById('save-btn').textContent='更新';
  document.getElementById('add-mode-label').textContent='修改支出';
  document.getElementById('del-btn').style.display='block';
  renderAmount(); renderCats();
}
function saveRecord(){
  const val=evalExpr(amount);                  // 表达式自动结算（如 12+5-3）
  if(!(val>0)){ toast('请输入金额'); return; }
  if(!selectedCat){ toast('请选择分类'); return; }
  const date=document.getElementById('in-date').value || todayStr();
  const note=document.getElementById('in-note').value.trim();
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    Object.assign(r,{amount:val,category:selectedCat,date,note});
    toast('已更新');
  } else {
    records.push({id:uid(),amount:val,category:selectedCat,date,note,ts:Date.now()});
    toast('已记一笔 ✓');
  }
  persist(); resetForm(); renderList(); switchTab('list');
}
function deleteRecord(){
  if(!editingId) return;
  records=records.filter(x=>x.id!==editingId);
  persist(); resetForm(); renderList(); switchTab('list'); toast('已删除');
}

//==================== 明细页 ====================
function renderList(){
  // 汇总
  const t=todayStr(), m=curMonth();
  document.getElementById('sum-today').textContent=money(records.filter(r=>r.date===t).reduce((s,r)=>s+r.amount,0));
  document.getElementById('sum-month').textContent=money(records.filter(r=>r.date.startsWith(m)).reduce((s,r)=>s+r.amount,0));

  const area=document.getElementById('list-area');
  if(records.length===0){
    area.innerHTML=`<div class="empty"><span class="big">🧾</span>还没有记账<br>去「记账」记下第一笔吧</div>`; return;
  }
  // 按日期分组
  const sorted=[...records].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.ts-a.ts));
  const groups={};
  sorted.forEach(r=>{ (groups[r.date]=groups[r.date]||[]).push(r); });
  area.innerHTML = Object.keys(groups).map(date=>{
    const sum=groups[date].reduce((s,r)=>s+r.amount,0);
    const rows=groups[date].map(r=>{
      const c=catOf(r.category);
      return `<div class="rec" data-id="${r.id}">
        <div class="emo">${c.emo}</div>
        <div class="mid"><div class="c">${c.nm}</div>${r.note?`<div class="n">${escapeHtml(r.note)}</div>`:''}</div>
        <div class="amt">${money(r.amount)}</div></div>`;
    }).join('');
    return `<div class="day-group"><div class="day-head"><span>${dateLabel(date)}</span><span>${money(sum)}</span></div>${rows}</div>`;
  }).join('');
  area.querySelectorAll('.rec').forEach(el=>el.onclick=()=>loadForEdit(el.dataset.id));
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

//==================== 统计页 ====================
function shiftMonth(delta){
  let [y,m]=statMonth.split('-').map(Number);
  m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  statMonth=y+'-'+pad(m); renderStats();
}
function renderStats(){
  const [y,m]=statMonth.split('-').map(Number);
  document.getElementById('m-label').textContent=y+'年'+m+'月';
  const recs=records.filter(r=>r.date.startsWith(statMonth));
  const total=recs.reduce((s,r)=>s+r.amount,0);
  document.getElementById('st-total').textContent=money(total);
  document.getElementById('st-count').textContent='共 '+recs.length+' 笔';

  const body=document.getElementById('st-body');
  const barCard=document.getElementById('bar-card');
  if(recs.length===0){
    body.innerHTML=`<div class="empty" style="padding:30px 0"><span class="big">📊</span>本月还没有支出</div>`;
    barCard.style.display='none'; return;
  }
  barCard.style.display='block';

  // 分类汇总
  const byCat={};
  recs.forEach(r=>{ byCat[r.category]=(byCat[r.category]||0)+r.amount; });
  const data=Object.keys(byCat).map(k=>({...catOf(k),value:byCat[k]})).sort((a,b)=>b.value-a.value);

  body.innerHTML = donutSVG(data,total) + '<div class="legend">' + data.map(d=>{
    const pct=(d.value/total*100);
    return `<div class="row"><span class="dot" style="background:${d.color}"></span>
      <span class="lab">${d.emo} ${d.nm}</span>
      <span class="pct">${pct.toFixed(0)}%</span>
      <span class="amt">${money(d.value)}</span></div>`;
  }).join('') + '</div>';

  renderBars(y,m,recs);
}
function donutSVG(data,total){
  const R=70,C=2*Math.PI*R,cx=100,cy=100,sw=30; let off=0;
  const circles=data.map(d=>{
    const seg=d.value/total*C;
    const c=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${d.color}" stroke-width="${sw}"
      stroke-dasharray="${seg.toFixed(2)} ${(C-seg).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=seg; return c;
  }).join('');
  return `<div class="donut-wrap"><svg width="170" height="170" viewBox="0 0 200 200">${circles}
    <text x="100" y="94" text-anchor="middle" font-size="13" fill="#8a90a2">本月</text>
    <text x="100" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">${money(total)}</text>
  </svg></div>`;
}
function renderBars(y,m,recs){
  const days=new Date(y,m,0).getDate();
  const daily=new Array(days+1).fill(0);
  recs.forEach(r=>{ daily[parseDate(r.date).getDate()]+=r.amount; });
  const max=Math.max(...daily,1);
  let bars=''; for(let d=1;d<=days;d++){ const h=daily[d]/max*100;
    bars+=`<div class="bar" style="height:${h}%" title="${m}月${d}日 ${money(daily[d])}"></div>`; }
  document.getElementById('st-bars').innerHTML=bars;
  document.getElementById('st-bars-x').innerHTML=`<span>1</span><span>${Math.ceil(days/2)}</span><span>${days}</span>`;
}

//==================== 备份 ====================
function exportData(){
  const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='记账备份_'+todayStr()+'.json'; a.click();
  URL.revokeObjectURL(url); toast('已导出 '+records.length+' 笔');
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{
    const arr=JSON.parse(fr.result);
    if(!Array.isArray(arr)) throw 0;
    if(!confirm('导入将【覆盖】当前 '+records.length+' 笔数据，确定？')) return;
    records=arr.filter(r=>r && typeof r.amount==='number' && r.date)
               .map(r=>({id:r.id||uid(),amount:r.amount,category:r.category||'other',date:r.date,note:r.note||'',ts:r.ts||Date.now()}));
    persist(); renderList(); renderStats(); toast('已导入 '+records.length+' 笔');
  }catch(e){ toast('文件格式不对'); } };
  fr.readAsText(file);
}

//==================== 导航 ====================
function switchTab(name){
  document.querySelectorAll('section.tab').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  if(name==='add') resetForm();
  if(name==='list') renderList();
  if(name==='stats'){ statMonth=curMonth(); renderStats(); }
  window.scrollTo(0,0);
}

//==================== 绑定 & 启动 ====================
document.getElementById('save-btn').onclick=saveRecord;
document.getElementById('del-btn').onclick=deleteRecord;
document.getElementById('export-btn').onclick=exportData;
document.getElementById('import-btn').onclick=()=>document.getElementById('import-file').click();
document.getElementById('import-file').onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; };
document.getElementById('m-prev').onclick=()=>shiftMonth(-1);
document.getElementById('m-next').onclick=()=>shiftMonth(1);
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

buildKeypad(); renderCats(); resetForm(); renderList(); updateHeaderSub();

// 注册 Service Worker（用于离线，file:// 打开时会自动跳过）
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
